# Demo en Render (plan gratuito). Guía: docs/deployment.md, apartado "Demo en Render".
# La base es externa (Neon con pgvector): la gratuita de Render caduca a los 30 días.
services:
  - type: web
    name: ateneo-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL # postgresql+psycopg://usuario:clave@host/base?sslmode=require
        sync: false
      # Modelo real vía OpenRouter (API compatible con OpenAI). La clave se introduce en Render.
      - key: ATENEO_LLM_PROVIDER
        value: openai
      - key: ATENEO_LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: ATENEO_LLM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: ATENEO_LLM_API_KEYS
        sync: false
      # Las respuestas desarrolladas del modelo gratuito pueden pasar de 60 s; Nginx/Render cortan antes de 120 s.
      - key: ATENEO_LLM_TIMEOUT
        value: "100"
      # Fase 1: embeddings de prueba; cambiarlos obliga a resubir el corpus.
      - key: ATENEO_EMBEDDER
        value: fake
      # Con embeddings fake el vector solo no encuentra citas literales; el texto completo sí.
      - key: ATENEO_RETRIEVAL
        value: hybrid
      - key: ATENEO_MAX_UPLOAD_MB
        value: "20"

  - type: web
    name: ateneo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      # Mismo origen para el navegador: sin CORS. Si Render asigna otra URL a la API, cambiarla aquí.
      - type: rewrite
        source: /api/*
        destination: https://ateneo-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
